<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>AI Хайлт — Үнийн сан</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f6ff;--surface:#fff;--surface2:#f7f9fc;--border:#e2e8f0;--accent:#0ea5e9;--accent2:#0284c7;--accent-bg:rgba(14,165,233,.08);--text:#0f172a;--text2:#475569;--text3:#94a3b8;--goods:#10b981;--goods-bg:rgba(16,185,129,.08);--compare:#f59e0b;--compare-bg:rgba(245,158,11,.08);--open:#8b5cf6;--open-bg:rgba(139,92,246,.08);--danger:#ef4444;--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font-family:var(--sans);font-size:14px;color:var(--text)}
.app{display:flex;flex-direction:column;min-height:100vh}
header{border-bottom:1px solid var(--border);padding:0 32px;height:64px;display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);position:sticky;top:0;z-index:100}
.logo{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent2);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo-dot{width:10px;height:10px;background:linear-gradient(135deg,var(--accent),#06b6d4);border-radius:50%}
.nav{display:flex;gap:4px;margin-left:16px}
.nav a{font-size:13px;font-weight:500;padding:8px 16px;border-radius:8px;text-decoration:none;color:var(--text3)}
.nav a:hover{background:var(--surface2);color:var(--text)}
.nav a.active{background:var(--accent-bg);color:var(--accent2);font-weight:600}
.user-info{margin-left:auto;display:flex;align-items:center;gap:10px}
.user-badge{font-size:12px;color:var(--accent2);background:var(--accent-bg);border:1px solid rgba(14,165,233,.15);border-radius:8px;padding:5px 12px}
.logout-btn{font-size:12px;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer}

.content{flex:1;padding:28px 32px;max-width:1100px;margin:0 auto;width:100%}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:20px}

.search-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px}
.search-card textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;outline:none;resize:vertical;min-height:90px;font-family:inherit}
.search-card .row{display:flex;gap:8px;margin-top:10px}
.img-drop{flex:1;border:2px dashed #bae6fd;border-radius:10px;padding:12px;background:var(--surface2);font-size:12px;color:var(--text2);text-align:center;cursor:pointer}
.img-drop:hover{border-color:var(--accent);background:#f0f9ff}
.img-drop img{max-height:120px;margin:6px auto;display:block}
.run-btn{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;padding:12px 26px;cursor:pointer;white-space:nowrap}
.run-btn:hover{transform:translateY(-1px)}
.run-btn:disabled{opacity:.5}

.loading{text-align:center;padding:30px;color:var(--text3)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:#8b5cf6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.variant-section{margin-bottom:24px}
.variant-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.variant-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px}
.v-exact{background:var(--goods-bg);color:var(--goods)}
.v-similar{background:var(--compare-bg);color:var(--compare)}
.v-related{background:var(--surface2);color:var(--text3)}

.prod{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:10px}
.prod-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prod-name{font-size:14px;font-weight:600;flex:1}
.prod-sim{font-family:var(--mono);font-size:11px;color:var(--accent2);font-weight:600}
.prod-meta{font-size:11px;color:var(--text3);margin-bottom:10px}
.price-summary{display:flex;gap:16px;margin-bottom:10px}
.ps-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;flex:1}
.ps-label{font-size:10px;color:var(--text3);text-transform:uppercase;font-weight:600;margin-bottom:3px}
.ps-val{font-family:var(--mono);font-size:13px;font-weight:700}
.ps-sub{font-size:10px;color:var(--text3);margin-top:2px}

.price-list{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;background:var(--surface2);border-radius:8px;padding:8px}
.price-row{display:flex;gap:8px;font-size:12px;padding:4px 8px;border-radius:6px;align-items:center}
.price-row:hover{background:var(--surface)}
.ps-type{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px}
.ps-sup{background:var(--accent-bg);color:var(--accent2)}
.ps-own{background:var(--open-bg);color:var(--open)}
.ps-src{color:var(--text2);flex:1;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-amt{font-family:var(--mono);font-weight:600}
.ps-date{color:var(--text3);font-family:var(--mono);font-size:10px}
.empty{text-align:center;padding:40px;color:var(--text3);font-size:13px}
</style>
</head>
<body>

<div class="app">
  <header>
    <a class="logo" href="/"><div class="logo-dot"></div>ҮНИЙН САН</a>
    <nav class="nav">
      <a href="/">Нүүр</a><a href="/search" class="active">Хайлт</a><a href="/products">Бүтээгдэхүүн</a>
      <a href="/categories">Ангилал</a><a href="/upload">Оруулах</a>
    </nav>
    <div class="user-info">
      <span class="user-badge" id="ub"></span>
      <button class="logout-btn" onclick="doLogout()">Гарах</button>
    </div>
  </header>

  <div class="content">
    <div class="page-title">AI үнийн хайлт</div>
    <div class="page-sub">Шаардлага текст эсвэл зургаар илгээхэд сан доторх ойролцоо бүтээгдэхүүнүүдийг хувилбараар гаргана</div>

    <div class="search-card">
      <textarea id="q" placeholder="Жишээ: 25мм² зэс кабель, 380В хүчдэл, 100м уртрага&#10;М30 цемент 50кг шуудай&#10;Эсвэл зөвхөн 'трансформатор' гэсэн нийтлэг үг"></textarea>
      <div class="row">
        <label class="img-drop" id="img-drop">
          📷 Зураг нэмэх (нэмэлт — бараа материалын зураг)
          <div id="img-preview"></div>
          <input type="file" id="img" accept="image/*" style="display:none">
        </label>
        <button class="run-btn" onclick="run()">🔍 Хайх</button>
      </div>
    </div>

    <div class="loading" id="loading" style="display:none">
      <div class="spinner"></div>
      <div style="margin-top:10px">AI хайж байна...</div>
    </div>

    <div id="result" style="display:none">
      <div id="q-text" style="font-size:13px;color:var(--text2);margin-bottom:16px;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px"></div>
      <div class="variant-section" id="v-exact-section" style="display:none">
        <div class="variant-title">✓ Яг тохирох <span class="variant-badge v-exact" id="c-exact">0</span></div>
        <div id="v-exact"></div>
      </div>
      <div class="variant-section" id="v-similar-section" style="display:none">
        <div class="variant-title">~ Ойролцоо хувилбар <span class="variant-badge v-similar" id="c-similar">0</span></div>
        <div id="v-similar"></div>
      </div>
      <div class="variant-section" id="v-related-section" style="display:none">
        <div class="variant-title">… Холбогдох <span class="variant-badge v-related" id="c-related">0</span></div>
        <div id="v-related"></div>
      </div>
      <div class="empty" id="empty" style="display:none">Тохирох бүтээгдэхүүн олдсонгүй</div>
    </div>
  </div>
</div>

<script>
let imgFile = null;
let user = null;

async function check() {
  const r = await fetch('/api/me');
  if (!r.ok) { location.href='/'; return; }
  user = (await r.json()).user;
  document.getElementById('ub').textContent = user.full_name;
}
async function doLogout() { await fetch('/api/logout',{method:'POST'}); location.href='/'; }
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

const imgDrop = document.getElementById('img-drop');
const imgInput = document.getElementById('img');
imgDrop.addEventListener('click', () => imgInput.click());
imgInput.addEventListener('change', e => {
  if (e.target.files[0]) {
    imgFile = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => document.getElementById('img-preview').innerHTML = `<img src="${ev.target.result}">`;
    reader.readAsDataURL(imgFile);
  }
});

async function run() {
  const q = document.getElementById('q').value.trim();
  if (!q && !imgFile) { alert('Текст эсвэл зураг оруулна уу'); return; }

  document.getElementById('loading').style.display = '';
  document.getElementById('result').style.display = 'none';

  let r;
  if (imgFile) {
    const fd = new FormData();
    fd.append('query', q);
    fd.append('image', imgFile);
    r = await fetch('/api/search', {method:'POST', body:fd});
  } else {
    r = await fetch('/api/search', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query:q})});
  }

  document.getElementById('loading').style.display = 'none';
  if (!r.ok) { alert('Алдаа'); return; }
  const d = await r.json();

  document.getElementById('q-text').innerHTML = `<b>Хайлт:</b> ${esc(d.query)}`;
  document.getElementById('result').style.display = '';

  const variants = d.variants || {};
  renderVariant('exact', variants.exact || []);
  renderVariant('similar', variants.similar || []);
  renderVariant('related', variants.related || []);

  const total = (variants.exact||[]).length + (variants.similar||[]).length + (variants.related||[]).length;
  document.getElementById('empty').style.display = total === 0 ? '' : 'none';
}

function renderVariant(name, items) {
  const section = document.getElementById('v-'+name+'-section');
  if (!items.length) { section.style.display = 'none'; return; }
  section.style.display = '';
  document.getElementById('c-'+name).textContent = items.length;
  document.getElementById('v-'+name).innerHTML = items.map(renderProduct).join('');
}

function renderProduct(p) {
  const sim = p.similarity ? Math.round(p.similarity*100) : 0;
  const summary = p.price_summary || {};
  const sumHtml = (key, label, color) => {
    const s = summary[key];
    if (!s) return '';
    return `<div class="ps-item">
      <div class="ps-label" style="color:var(--${color})">${label}</div>
      <div class="ps-val">${s.avg.toLocaleString('mn-MN',{maximumFractionDigits:0})}₮</div>
      <div class="ps-sub">${s.min.toLocaleString('mn-MN',{maximumFractionDigits:0})} – ${s.max.toLocaleString('mn-MN',{maximumFractionDigits:0})} · ${s.count} үнэ</div>
    </div>`;
  };
  const priceHtml = (p.prices || []).map(x => {
    const cls = x.source_type === 'supplier' ? 'ps-sup' : 'ps-own';
    const label = x.source_type === 'supplier' ? 'нийл' : 'манай';
    const dt = x.price_date ? x.price_date.substring(0,10) : '';
    const amt = x.unit_price ? Number(x.unit_price).toLocaleString('mn-MN') : '—';
    return `<div class="price-row">
      <span class="ps-type ${cls}">${label}</span>
      <span class="ps-src">${esc(x.source_name||'')}</span>
      <span class="ps-amt">${amt} ${esc(x.currency||'')}</span>
      <span class="ps-date">${dt}</span>
    </div>`;
  }).join('') || '<div style="color:var(--text3);font-size:11px;padding:6px;text-align:center">Үнийн мэдээлэл байхгүй</div>';

  return `<div class="prod">
    <div class="prod-head">
      <span class="prod-name">${esc(p.name)}</span>
      ${sim ? `<span class="prod-sim">${sim}%</span>` : ''}
    </div>
    <div class="prod-meta">${esc(p.category_name||'')} · ${esc(p.type_name||'')}</div>
    <div class="price-summary">
      ${sumHtml('supplier', 'Нийлүүлэгч', 'accent2')}
      ${sumHtml('own', 'Манай үнэ', 'open')}
    </div>
    <div class="price-list">${priceHtml}</div>
  </div>`;
}

document.addEventListener('DOMContentLoaded', check);
</script>
</body>
</html>
